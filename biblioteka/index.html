(function(){

  var gate = document.getElementById('gate'), pw = document.getElementById('pw'), msg = document.getElementById('gate-msg');
  var lib = document.getElementById('lib'), lockBtn = document.getElementById('lock-btn');
  var KEY = 'varlib-lib-pw', files = {}, CK = null;
  function ub(s){ var b = atob(s), a = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) a[i] = b.charCodeAt(i); return a; }
  function store(k, v){ try { v === null ? sessionStorage.removeItem(k) : sessionStorage.setItem(k, v); } catch (e) {} }
  function load(k){ try { return sessionStorage.getItem(k); } catch (e) { return null; } }
  async function open(pass, quiet){
    if (!window.crypto || !crypto.subtle) { msg.textContent = 'Ta przeglądarka nie obsługuje odszyfrowania. Otwórz stronę w aktualnym Chrome, Edge, Firefox lub Safari.'; return; }
    try {
      var base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey']);
      var key = await crypto.subtle.deriveKey({name:'PBKDF2', salt:ub(V.s), iterations:V.n, hash:'SHA-256'}, base, {name:'AES-GCM', length:256}, false, ['decrypt']);
      var plain = await crypto.subtle.decrypt({name:'AES-GCM', iv:ub(V.i)}, key, ub(V.c));
      var data = JSON.parse(new TextDecoder().decode(plain));
      CK = key; files = data.files; lib.innerHTML = data.html; gate.hidden = true; lockBtn.hidden = false;
      store(KEY, pass); wire();
      if (!quiet) lib.querySelector('h2').scrollIntoView({behavior:'smooth', block:'start'});
    } catch (e) {
      if (!quiet) { msg.textContent = 'Nieprawidłowe hasło. Sprawdź wielkość liter i spróbuj ponownie.'; pw.select(); }
      store(KEY, null);
    }
  }
  function wire(){
    lib.querySelectorAll('[data-cp]').forEach(function(b){
      b.addEventListener('click', function(){
        var t = document.getElementById(b.dataset.cp).textContent;
        var done = function(){ b.textContent = 'Skopiowano ✓'; setTimeout(function(){ b.textContent = 'Kopiuj'; }, 1600); };
        if (navigator.clipboard) navigator.clipboard.writeText(t).then(done, function(){ b.textContent = 'Zaznacz i skopiuj'; });
        else b.textContent = 'Zaznacz i skopiuj';
      });
    });
    lib.querySelectorAll('[data-dl]').forEach(function(b){
      b.addEventListener('click', function(){
        var n = b.dataset.dl, url = URL.createObjectURL(new Blob([files[n]], {type:'text/markdown;charset=utf-8'}));
        var a = document.createElement('a'); a.href = url; a.download = n; document.body.appendChild(a); a.click(); a.remove();
        setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
      });
    });
    lib.querySelectorAll('[data-pdf]').forEach(function(b){
      b.addEventListener('click', async function(){
        var lbl = b.querySelector('.ext'), old = lbl.textContent; lbl.textContent = 'pobieram…';
        try {
          var r = await fetch('pliki/' + b.dataset.pdf + '.bin'); var buf = new Uint8Array(await r.arrayBuffer());
          var pdf = await crypto.subtle.decrypt({name:'AES-GCM', iv:buf.slice(0, 12)}, CK, buf.slice(12));
          var url = URL.createObjectURL(new Blob([pdf], {type:'application/pdf'}));
          var a = document.createElement('a'); a.href = url; a.download = b.dataset.pdf + '.pdf'; document.body.appendChild(a); a.click(); a.remove();
          setTimeout(function(){ URL.revokeObjectURL(url); }, 4000); lbl.textContent = old;
        } catch (e) { lbl.textContent = 'błąd pobierania, spróbuj ponownie'; }
      });
    });
    lib.querySelectorAll('[data-wk]').forEach(function(c){
      var k = 'varlib-wk-' + c.dataset.wk;
      try { c.checked = localStorage.getItem(k) === '1'; } catch (e) {}
      c.addEventListener('change', function(){ try { localStorage.setItem(k, c.checked ? '1' : '0'); } catch (e) {} });
    });
  }
  gate.addEventListener('submit', function(e){ e.preventDefault(); msg.textContent = 'Otwieram…'; open(pw.value, false); });
  lockBtn.addEventListener('click', function(){ store(KEY, null); lib.innerHTML = ''; gate.hidden = false; lockBtn.hidden = true; pw.value = ''; msg.textContent = ''; pw.focus(); });
  var saved = load(KEY); if (saved) open(saved, true);
})();
</script>
</body>
</html>
